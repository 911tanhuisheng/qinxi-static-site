name: 发布静态网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取网站文件
        uses: actions/checkout@v6
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传静态页面
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
