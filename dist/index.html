<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="静态网站部署测试页面">
  <title>部署成功</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M18 33l9 9 19-21' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #14312f;
      background: linear-gradient(145deg, #ecfdf5, #ccfbf1);
    }
    main {
      width: min(560px, 100%);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 118, 110, 0.16);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      color: white;
      font-size: 38px;
      background: #0f766e;
      border-radius: 50%;
    }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 7vw, 48px); }
    p { margin: 8px 0; color: #446764; line-height: 1.7; }
    time { font-weight: 650; color: #0f766e; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>部署成功</h1>
    <p>这个静态网页已经成功发布并可正常访问。</p>
    <p>测试日期：<time datetime="2026-09-25">2026 年 9 月 25 日</time></p>
  </main>
</body>
</html>
